name: Check Notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call notification check endpoint
        run: |
          curl -f -X GET "${{ secrets.APP_URL }}/api/cron/check-notifications" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"