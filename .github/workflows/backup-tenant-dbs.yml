name: Backup Tenant Databases
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client (pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Clone backup repo
        run: |
          git clone "https://x-access-token:${{ secrets.BACKUP_REPO_TOKEN }}@github.com/${{ secrets.BACKUP_REPO }}.git" backup-repo
          cd backup-repo
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"

      - name: Run backups for all tenants
        id: run_backups
        run: |
          chmod +x scripts/backup-tenant-db.sh
          echo '${{ secrets.TENANT_DB_URLS }}' > /tmp/tenants.json
          FAILED=0
          for slug in $(jq -r 'keys[]' /tmp/tenants.json); do
            url=$(jq -r --arg s "$slug" '.[$s]' /tmp/tenants.json)
            if ! ./scripts/backup-tenant-db.sh "$slug" "$url" "backup-repo"; then
              echo "::error::Backup failed for tenant: $slug"
              FAILED=1
            fi
          done
          rm -f /tmp/tenants.json
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Commit and push backups
        run: |
          cd backup-repo
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Backup $(date -u +"%Y-%m-%d %H:%M UTC")"
            git push
          fi

      - name: Fail job if any tenant backup failed
        if: steps.run_backups.outputs.failed == '1'
        run: exit 1